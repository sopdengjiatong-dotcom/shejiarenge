<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>灵魂的边界 · 深度人格与耗能图谱</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 引入优雅的衬线字体 */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; 
            background-color: #F9F6F0; /* 象牙白纸张底色 */
            font-family: 'Noto Serif SC', serif; 
            color: #33312E; /* 深炭灰 */
            overflow: hidden; 
        }

        /* 氛围光晕 */
        .glow { position: fixed; width: 50vh; height: 50vh; filter: blur(100px); z-index: -1; opacity: 0.4; animation: float 15s infinite alternate; border-radius: 50%; }
        .glow-1 { background: #E5D5C8; top: -10%; left: -10%; }
        .glow-2 { background: #D5D6CD; bottom: -10%; right: -10%; animation-delay: -7s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

        /* 顶部纤细进度条 */
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: rgba(51, 49, 46, 0.05); z-index: 20; }
        .progress-bar { height: 100%; background: #B07D6B; width: 0%; transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .progress-indicator { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: #8A817C; z-index: 25; letter-spacing: 2px; }

        /* 主容器 */
        #main-container { max-width: 650px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 80px 24px 20px 24px; overflow-y: auto; }
        
        /* 题目卡片 */
        .question-box {
            opacity: 0; transform: translateY(20px); transition: all 0.5s ease;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 50px 40px; border-radius: 2px; 
            border: 1px solid rgba(176, 125, 107, 0.15); 
            box-shadow: 0 15px 35px rgba(51, 49, 46, 0.03);
            width: 100%; text-align: center; position: relative;
        }
        .question-box::before, .question-box::after { content: ''; position: absolute; width: 10px; height: 10px; border: 1px solid #B07D6B; opacity: 0.5; }
        .question-box::before { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .question-box::after { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        .question-box.active { opacity: 1; transform: translateY(0); }
        .question-box.fade-out { opacity: 0; transform: translateY(-20px); }
        
        .part-title { font-size: 0.85rem; letter-spacing: 4px; color: #B07D6B; margin-bottom: 20px; text-transform: uppercase; text-align: center; font-weight: 500; }
        .question-text { font-size: 1.35rem; line-height: 1.9; margin-bottom: 40px; font-weight: 400; color: #33312E; text-align: justify; text-align-last: center; }

        /* 选项列表 */
        .options-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .option-item {
            background: transparent; border: 1px solid #D6D2CB; padding: 20px 30px;
            cursor: pointer; transition: all 0.4s ease; font-size: 1.05rem; text-align: left;
            color: #5C5552; line-height: 1.6; position: relative; overflow: hidden;
        }
        .option-item::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: rgba(176, 125, 107, 0.05); transition: all 0.4s ease; z-index: -1;
        }
        .option-item:hover { border-color: #B07D6B; color: #33312E; transform: translateY(-2px); }
        .option-item:hover::before { left: 0; }
        .option-item:active { transform: scale(0.98); }

        .nav-buttons { display: flex; justify-content: center; margin-top: 10px; }
        .prev-btn {
            padding: 8px 0; background: transparent; color: #8A817C; border: none; border-bottom: 1px solid #8A817C;
            font-size: 0.9rem; font-family: 'Noto Serif SC', serif; cursor: pointer; transition: 0.3s; letter-spacing: 2px;
        }
        .prev-btn:hover { color: #33312E; border-color: #33312E; }
        .prev-btn.hidden { display: none; }

        /* 转场与验证层 */
        .intermission, .verify-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(249, 246, 240, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 70; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.8s ease;
        }
        .intermission-text { font-size: 1.4rem; color: #B07D6B; letter-spacing: 4px; border-bottom: 1px solid rgba(176, 125, 107, 0.3); padding-bottom: 10px; text-align: center; line-height: 1.6; }
        
        .verify-box {
            background: #FFFDFC; padding: 60px; border: 1px solid #E5E0D8;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; max-width: 400px;
        }
        .verify-decor { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: #B07D6B; line-height: 1; margin-bottom: 10px; font-style: italic; }
        .verify-title { font-size: 1.4rem; margin-bottom: 5px; color: #33312E; letter-spacing: 6px; }
        .verify-subtitle { font-size: 0.85rem; color: #A39B98; margin-bottom: 40px; letter-spacing: 2px; font-family: 'Cormorant Garamond', serif; text-transform: uppercase; }
        .verify-input {
            width: 180px; font-size: 1.5rem; padding: 10px; border: none; border-bottom: 1px solid #B07D6B;
            background: transparent; color: #33312E; text-align: center; letter-spacing: 10px; margin-bottom: 40px; outline: none; font-family: 'Cormorant Garamond', serif;
        }
        .verify-btn {
            padding: 14px 40px; background: #33312E; color: #FFFDFC; font-size: 1rem;
            letter-spacing: 4px; border: 1px solid #33312E; cursor: pointer; transition: 0.4s; font-family: 'Noto Serif SC', serif;
        }
        .verify-btn:hover { background: transparent; color: #33312E; }

        /* 报告卡片 - 增加内部滚动 */
        #report-card {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; max-width: 750px; background: #FFFDFC; color: #33312E;
            z-index: 110; display: none; 
            border: 1px solid #EAE5DD; outline: 1px solid #EAE5DD; outline-offset: -8px;
            box-shadow: 0 30px 60px rgba(51, 49, 46, 0.08); opacity: 0; transition: opacity 1.2s;
            max-height: 85vh; overflow-y: auto;
        }

        /* 隐藏或美化滚动条 */
        #report-card::-webkit-scrollbar { width: 6px; }
        #report-card::-webkit-scrollbar-track { background: transparent; }
        #report-card::-webkit-scrollbar-thumb { background: #EAE5DD; border-radius: 10px; }
        #report-card::-webkit-scrollbar-thumb:hover { background: #D6D2CB; }

        .report-content { padding: 60px 50px 50px; position: relative; }
        
        .stamp-decor {
            position: absolute; top: 40px; right: 40px; width: 60px; height: 60px;
            border: 1px solid rgba(176, 125, 107, 0.4); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cormorant Garamond', serif; font-size: 0.7rem; color: rgba(176, 125, 107, 0.6);
            text-transform: uppercase; text-align: center; line-height: 1.2; transform: rotate(15deg);
        }

        .report-header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #F0ECE4; padding-bottom: 30px; }
        .report-header h1 { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: #A39B98; font-style: italic; font-weight: 400; margin-bottom: 20px; letter-spacing: 2px; }
        .type-title { font-size: 2.2rem; font-weight: 600; color: #33312E; margin: 0 0 10px 0; letter-spacing: 2px; }
        .type-sub { font-size: 1.2rem; color: #B07D6B; letter-spacing: 6px; }
        .type-tags { font-size: 0.9rem; color: #A39B98; margin-top: 15px; letter-spacing: 1px; line-height: 1.6; }

        .text-section { margin-bottom: 35px; }
        .section-heading {
            text-align: center; font-size: 1.05rem; color: #33312E; margin-bottom: 15px; letter-spacing: 4px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .section-heading::before, .section-heading::after { content: ''; width: 30px; height: 1px; background: #D6D2CB; }
        .analysis-p { font-size: 1rem; line-height: 2; color: #5C5552; text-align: justify; margin: 0; }
        
        .prescription-box { background: rgba(249, 246, 240, 0.5); border: 1px solid #EAE5DD; padding: 30px; margin-top: 10px; }
        .prescription-content { font-size: 0.95rem; line-height: 2; color: #5C5552; }
        .prescription-content b { color: #B07D6B; font-weight: 600; }
        
        .footer-info { margin-top: 40px; display: flex; justify-content: space-between; align-items: flex-end; }
        .date-stamp { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: #A39B98; }
        
        .action-buttons { display: flex; gap: 15px; }
        .btn { padding: 10px 20px; font-size: 0.95rem; font-family: 'Noto Serif SC', serif; cursor: pointer; transition: 0.3s; letter-spacing: 2px; background: transparent; }
        .btn-secondary { border: 1px solid #D6D2CB; color: #5C5552; }
        .btn-secondary:hover { border-color: #33312E; color: #33312E; }
        .btn-primary { border: 1px solid #B07D6B; background: #B07D6B; color: #FFF; }
        .btn-primary:hover { background: transparent; color: #B07D6B; }

        @media (max-width: 700px) {
            #main-container { padding: 70px 16px 20px; }
            .question-box { padding: 40px 25px; }
            .question-text { font-size: 1.2rem; margin-bottom: 30px; }
            .option-item { padding: 16px 20px; font-size: 0.95rem; }
            .verify-box { padding: 50px 30px; width: 90%; }
            #report-card { width: 92%; max-height: 90vh; outline: none; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
            .report-content { padding: 40px 25px; }
            .stamp-decor { top: 20px; right: 20px; width: 50px; height: 50px; font-size: 0.6rem; }
            .type-title { font-size: 1.8rem; }
            .type-sub { font-size: 1rem; }
            .footer-info { flex-direction: column; gap: 25px; align-items: center; }
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="progress-indicator" id="progress-text">1 / 42</div>

    <div id="main-container"></div>

    <div class="intermission" id="intermission"><div class="intermission-text" id="intermission-text"></div></div>

    <div class="verify-layer" id="verify-layer">
        <div class="verify-box">
            <div class="verify-decor">❦</div>
            <p class="verify-title">开启信笺</p>
            <p class="verify-subtitle">Unlock the soul trajectory</p>
            <input type="text" class="verify-input" id="verify-code" autocomplete="off" maxlength="5">
            <button class="verify-btn" id="verify-submit">查看画像</button>
        </div>
    </div>

    <div id="report-card">
        <div class="report-content" id="reportContent"></div>
    </div>

    <script>
        (function() {
            // 题库：前 36 题测讨好维度，后 6 题测耗能维度 (已去除题号和字母前缀，适合打乱)
            const questions = [
                // ------ 第一到第六篇章 (维度1：性格倾向) ------
                { part: "第一篇章：防御机制与冲突应对", text: "临近下班，你自己的项目还没做完，一位平时经常把麻烦推给别人的同事又跑来向你求助，声称自己“快崩溃了”。你会：", options: [
                    { t: "压抑自己的焦虑，立刻接手他的工作，哪怕自己今晚要熬夜到凌晨。", type: "A" },
                    { t: "内心充满怨气，但嘴上还是答应了，一边做一边在心里狠狠责怪自己为什么不拒绝。", type: "B" },
                    { t: "温和但坚定地表明自己也有死线要赶，建议他去找主管协调资源。", type: "C" },
                    { t: "冷嘲热讽地指出他平时的工作态度问题，让他自己承担后果。", type: "D" }
                ] },
                { text: "在一次朋友聚餐中，有人当众拿你的身材或痛点开了一个极不恰当的玩笑。你的“自我（Ego）”会如何调节？", options: [
                    { t: "跟着大家一起大笑，甚至自黑得更厉害，生怕气氛冷场。", type: "A" },
                    { t: "强颜欢笑，但脸涨得通红，回家后在被窝里反刍这件事并暗自流泪。", type: "B" },
                    { t: "收起笑容，严肃地看着对方说：“这个玩笑并不好笑，我感觉被冒犯了。”", type: "C" },
                    { t: "直接一杯水泼在对方脸上，或者用更恶毒的话当场反击。", type: "D" }
                ] },
                { text: "你花了一个月心血熬出来的企划案，被上司用极其刻薄的语言贬低得一文不值。你会：", options: [
                    { t: "认为全都是自己的错，陷入极度的自我厌恶，并承诺今晚通宵重写。", type: "A" },
                    { t: "感到极度委屈，但在上司面前拼命点头称是，转头向同事大吐苦水。", type: "B" },
                    { t: "虚心接受有建设性的意见，但对人身攻击的部分保持内心的界限，不让它击碎自尊。", type: "C" },
                    { t: "当场拍桌子辞职，认为这种不懂欣赏的庸人根本不配拥有你的才华。", type: "D" }
                ] },
                { text: "室友或伴侣不小心打碎了你攒钱买来的、意义非凡的限量版杯子。为了避免冲突，你会：", options: [
                    { t: "赶紧把碎片扫掉，笑着说“没关系，我正好想换个新的”，反而去安慰对方。", type: "A" },
                    { t: "心里很痛，但强忍着不说，之后好几天都对对方冷暴力。", type: "B" },
                    { t: "坦诚地表达你的难过：“我很看重这个杯子，它碎了让我很伤心。”", type: "C" },
                    { t: "大发雷霆，要求对方立刻赔偿一个一模一样的，否则这事没完。", type: "D" }
                ] },
                { text: "面对父母打着“为你好”旗号的过度干涉（比如催婚、逼迫考公），你的防御机制通常是：", options: [
                    { t: "彻底放弃抵抗，顺从他们的安排，把真实的自己扼杀在摇篮里。", type: "A" },
                    { t: "表面敷衍答应，背地里却通过拖延、生病等隐蔽的方式来表达抗拒。", type: "B" },
                    { t: "坐下来与他们进行艰难但真诚的对话，明确划定理性与爱的边界。", type: "C" },
                    { t: "彻底切断联系，用最决绝的方式斩断所有的亲情羁绊。", type: "D" }
                ] },
                { text: "当你对某个人产生了强烈的愤怒，但又害怕表达出来会破坏关系时，你最常使用的“反向形成”是：", options: [
                    { t: "表现得对他比平时更加热情和殷勤，试图用讨好来掩盖愤怒。", type: "A" },
                    { t: "在朋友圈发一些仅他可见的伤感或隐晦的句子，希望他能自己领悟。", type: "B" },
                    { t: "找一个合适的时机，用“我感到…”的句式，平静地向他表达我的不满。", type: "C" },
                    { t: "把愤怒转移到其他无关的人或事物上（比如踢路边的垃圾桶或骂服务员）。", type: "D" }
                ] },
                { part: "第二篇章：依恋理论（亲密关系与被弃恐惧）", text: "你给正在暧昧的对象发了一条长长的心里话，但整整四个小时过去，对话框依然死寂。你的反应是：", options: [
                    { t: "陷入极度恐慌，连续发十几条消息道歉：“我是不是说错话了？你别生气。”", type: "A" },
                    { t: "疯狂刷新朋友圈看他有没有动态，脑海中上演了一百种他讨厌你的剧本。", type: "B" },
                    { t: "觉得他可能在忙或者在思考如何回复，放下手机先去处理自己的事情。", type: "C" },
                    { t: "觉得这种不及时回复的人根本不值得交往，直接拉黑删除。", type: "D" }
                ] },
                { text: "你的伴侣最近工作非常忙碌，连续两周没有陪你度过周末。你会：", options: [
                    { t: "每天为他做好精美的便当送到公司，试图用极度的体贴换取他哪怕一秒的关注。", type: "A" },
                    { t: "变得非常粘人和敏感，经常旁敲侧击地问他“你是不是不爱我了”。", type: "B" },
                    { t: "理解他的处境，趁这个时间安排自己一直想去看的画展或和朋友聚会。", type: "C" },
                    { t: "认为自己被冷落了，于是故意去找前任或异性朋友出去玩以报复他。", type: "D" }
                ] },
                { text: "在一个完全陌生的社交派对上，带你来的朋友突然被其他人叫走，留下你一个人。你会：", options: [
                    { t: "像个无头苍蝇一样端着酒杯去迎合别人的话题，哪怕自己根本不感兴趣。", type: "A" },
                    { t: "局促不安地躲在角落里玩手机，觉得自己是个不受欢迎的透明人。", type: "B" },
                    { t: "泰然自若地品尝美食，观察人群，如果觉得无聊就礼貌地提前离开。", type: "C" },
                    { t: "觉得这个派对烂透了，朋友也极其不靠谱，一声不吭地直接走人。", type: "D" }
                ] },
                { text: "当你在生活中遭遇了重大挫折（如失业、大病），你需要向亲密的人求助时，你的真实心态是：", options: [
                    { t: "“我不能告诉他们，我必须永远扮演那个有用的人，否则他们会离开我。”", type: "A" },
                    { t: "“如果我展示了我的软弱，他们一定会觉得我变成了累赘。”", type: "B" },
                    { t: "“我愿意向他们敞开伤口，因为我相信我们能共同承受生命的重量。”", type: "C" },
                    { t: "“我不需要任何人的同情，我自己能解决，别人只会看我的笑话。”", type: "D" }
                ] },
                { text: "如果有人试图靠近你，想要了解你内心深处的创伤和过去，你会：", options: [
                    { t: "毫无保留地全盘托出，甚至过度暴露，试图用卖惨来换取对方的同情和爱。", type: "A" },
                    { t: "既渴望被理解又害怕被评判，说一半留一半，时刻观察对方的表情。", type: "B" },
                    { t: "评估对方的可靠程度，在感到安全的前提下，缓慢而真诚地分享。", type: "C" },
                    { t: "竖起满身尖刺，冷硬地告诉对方：“我的事与你无关，别来探听我的隐私。”", type: "D" }
                ] },
                { text: "当一段曾经形影不离的友谊，因为彼此的生活轨迹不同而自然渐行渐远时，你会：", options: [
                    { t: "拼命去迎合对方现在的圈子和喜好，试图用卑微的讨好来强行挽留。", type: "A" },
                    { t: "陷入深深的自责，觉得一定是因为自己不够好，才会被朋友“抛弃”。", type: "B" },
                    { t: "接受这遗憾的现实，将美好的回忆珍藏，并在节假日送上真诚的祝福。", type: "C" },
                    { t: "觉得对方是个忘恩负义的势利眼，把对方所有的联系方式都拉黑。", type: "D" }
                ] },
                { part: "第三篇章：认知行为流派（核心信念与认知扭曲）", text: "你在跨部门会议上发言时，坐在对面的总监突然皱了一下眉头。你的第一念头是：", options: [
                    { t: "“他觉得我的方案蠢透了，我的职业生涯要完蛋了，我就是个废物。”", type: "A" },
                    { t: "“我是不是刚才说错数据了？我的声音是不是在发抖让他觉得我很不专业？”", type: "B" },
                    { t: "“他可能是对某个具体的细节有疑问，或者只是昨晚没睡好。”", type: "C" },
                    { t: "“这老头懂什么？他根本理解不了我方案的超前性。”", type: "D" }
                ] },
                { text: "为了策划一场朋友聚会，你忙前忙后。结果聚会当天，预定的餐厅由于停电无法营业。你会觉得：", options: [
                    { t: "“我搞砸了一切，大家一定在心里恨死我了，我以后再也不配组局了。”", type: "A" },
                    { t: "“天哪，我为什么没有提前准备Plan B，我真是个成事不足败事有余的人。”", type: "B" },
                    { t: "“这真是个意外，不过没关系，大家在一起最重要，我们换去旁边吃火锅吧。”", type: "C" },
                    { t: "“这破餐厅真晦气，朋友们要是敢抱怨一句，以后我就再也不管这闲事了。”", type: "D" }
                ] },
                { text: "朋友随口评价了一句：“你最近好像胖了一点/憔悴了一点。”你的“读心术”机制会如何翻译这句话？", options: [
                    { t: "“他觉得我丑爆了，他嫌弃我了，我必须立刻开始极端的节食/整容。”", type: "A" },
                    { t: "“他一定是在暗示我最近状态太差了，我得表现得多一点活力来掩盖。”", type: "B" },
                    { t: "“他只是陈述了一个视觉感受，确实最近加班太多/没怎么运动。”", type: "C" },
                    { t: "“他自己长得那个样子好意思说我？真是狗嘴里吐不出象牙。”", type: "D" }
                ] },
                { text: "当别人向向你提出一个严重超出你能力或职责范围的要求（比如让你替他背黑锅）时，你会：", options: [
                    { t: "觉得如果拒绝就会被整个圈子排挤，于是含泪答应，自己承担所有后果。", type: "A" },
                    { t: "不敢直接拒绝，找各种蹩脚的借口试图拖延，最后还是被逼着做了。", type: "B" },
                    { t: "毫不犹豫地明确拒绝，告诉对方这违反了你的原则和底线。", type: "C" },
                    { t: "录音保留证据，然后反手把他举报到上级那里，让他身败名裂。", type: "D" }
                ] },
                { text: "在你的核心信念中，“被拒绝”这个事件等同于什么？", options: [
                    { t: "我这个人的存在就是没有价值的，我是一滩烂泥。", type: "A" },
                    { t: "一张证明我不够好的成绩单，让我感到强烈的羞耻和挫败。", type: "B" },
                    { t: "一次需求的不匹配，说明在这件事上我们没有达成共识。", type: "C" },
                    { t: "对方没有眼光，错失了一个天大的好机会。", type: "D" }
                ] },
                { text: "面对他人偶尔的冷落或没有及时回馈，你的“灾难化思维”会描绘出怎样的图景？", options: [
                    { t: "“他一定是在和别人说我的坏话，所有人都联合起来孤立我了。”", type: "A" },
                    { t: "“我们的关系肯定出现了无法弥补的裂痕，我即将失去他。”", type: "B" },
                    { t: "“每个人都有自己的生活节奏，这不代表针对我。”", type: "C" },
                    { t: "“他这是在向我宣战，那我以后绝不会再给他好脸色看。”", type: "D" }
                ] },
                { part: "第四篇章：人本主义流派（自我价值与真实自我）", text: "为了在长辈或亲戚眼中保持一个“乖巧懂事”的人设，你愿意付出多大的代价？", options: [
                    { t: "放弃自己喜欢的伴侣、职业和爱好，完全按照他们的剧本来度过一生。", type: "A" },
                    { t: "表面上维持乖巧，内心痛苦不堪，经常在夜里有一种被抽空灵魂的感觉。", type: "B" },
                    { t: "保持基本的礼貌与尊重，但在涉及人生重大决定时，坚持自己的选择。", type: "C" },
                    { t: "在家庭聚会上故意穿得奇装异服，发表离经叛道的言论，以此来气他们。", type: "D" }
                ] },
                { text: "当你对某个社会热点事件有自己独特的看法，但发现周围同事的主流意见完全相反时，你会：", options: [
                    { t: "立刻改变自己的观点，附和他们，甚至表现得比他们还要激进。", type: "A" },
                    { t: "保持沉默，假装没听见，害怕自己一旦开口就会被群体排斥。", type: "B" },
                    { t: "平和地表达自己的观点，认为和而不同才是人际交往的常态。", type: "C" },
                    { t: "认为他们都是被洗脑的蠢货，用极具攻击性的语言与他们辩论。", type: "D" }
                ] },
                { text: "人本主义者卡尔·罗杰斯问你：你的“自我价值感”通常来源于哪里？", options: [
                    { t: "来源于领导的表扬、朋友圈的点赞和伴侣的夸奖——如果没有这些，我就一无是处。", type: "A" },
                    { t: "很大程度上受外界评价影响——别人夸我我就开心一整天，骂我我就崩溃。", type: "B" },
                    { t: "来源于内心的充实和我对自己的认可——外界的评价只是参考，不是定义。", type: "C" },
                    { t: "来源于我能掌控多少人，或者我能在争论中驳倒多少人。", type: "D" }
                ] },
                { text: "如果你原本热爱写晦涩但深刻的独立文学，但发现写口水爽文能获得更多流量和金钱，你会：", options: [
                    { t: "彻底放弃初衷，每天批量生产自己都觉得恶心的文字，只为讨好读者。", type: "A" },
                    { t: "为了生存写爽文，但内心充满对自己的鄙视，觉得出卖了灵魂。", type: "B" },
                    { t: "找一份能养活自己的正职，把独立文学作为纯粹的自我实现，不妥协于市场。", type: "C" },
                    { t: "痛骂这个时代审美的堕落，认为读者都不配看自己的作品。", type: "D" }
                ] },
                { text: "在你看来，“讨好他人”在你的生命历程中扮演着什么角色？", options: [
                    { t: "是我赖以生存的氧气面罩，没有它我就会在人际交往中窒息而死。", type: "A" },
                    { t: "是一件穿久了脱不下来的紧身衣，勒得我喘不过气，但脱下来又怕冷。", type: "B" },
                    { t: "是我曾经不成熟时的生存策略，现在我已经学会了用真实的自我去连接世界。", type: "C" },
                    { t: "是弱者才玩的游戏，我的人生信条是让别人来讨好我。", type: "D" }
                ] },
                { text: "当你感到深深的疲惫或抑郁，却又不得不去参加一个推脱不掉的社交应酬时，你会：", options: [
                    { t: "逼迫自己喝下几杯酒，变成全场最活跃的开心果，把悲伤深深压抑。", type: "A" },
                    { t: "戴上礼貌的假面具，强撑着应付所有人，回家后感觉整个人像被榨干了一样。", type: "B" },
                    { t: "适度参与，不勉强自己活跃气氛，在感到难以承受时提前找借口离开。", type: "C" },
                    { t: "全程黑脸，对任何来搭话的人都冷言冷语，把负能量传染给全场。", type: "D" }
                ] },
                { part: "第五篇章：社会交换理论（成本与收益的失衡）", text: "在一段关系中，你总是那个主动买单、主动策划约会、主动提供情绪价值的人。对方心安理得地接受，却鲜少回报。你会：", options: [
                    { t: "继续加倍付出，深信只要自己做得足够多、足够好，对方总有一天会被感动。", type: "A" },
                    { t: "感到非常委屈和不平衡，但又不敢停止付出，害怕一旦停止关系就会结束。", type: "B" },
                    { t: "停止单方面的付出，与对方坦诚沟通你的感受；如果对方依然如故，便及时止损。", type: "C" },
                    { t: "突然翻脸，把过去所有的花费和付出列一张账单拍在对方面前，要求他偿还。", type: "D" }
                ] },
                { text: "你的一个熟人，平时从来不联系你，只有在需要借钱或者帮忙投票、砍一刀时才会发消息给你。你会：", options: [
                    { t: "害怕被说小气，不仅立刻帮忙，还主动嘘寒问暖，问对方还有什么需要。", type: "A" },
                    { t: "心里很反感这种“工具人”的待遇，但碍于面子还是勉强帮了。", type: "B" },
                    { t: "委婉但明确地拒绝，或者干脆当作没看见，不让这种低质量关系消耗自己。", type: "C" },
                    { t: "截图发到朋友圈公开嘲讽，让所有人都看看他的嘴脸。", type: "D" }
                ] },
                { text: "当你处于“连轴转”的加班状态，已经极其疲惫，此时一个关系一般的朋友想找你倾诉他失恋的痛苦，你会：", options: [
                    { t: "强打精神，陪他打电话聊到凌晨三点，第二天自己顶着黑眼圈去挨老板的骂。", type: "A" },
                    { t: "一边打瞌睡一边听，心里烦躁得不行，但嘴上还在不断发出“嗯嗯”的安慰声。", type: "B" },
                    { t: "坦白告诉他：“我今晚真的太累了快晕倒了，明天下班后我请你喝杯酒好好聊聊。”", type: "C" },
                    { t: "不耐烦地打断他：“你失恋算什么？我都快猝死了，别拿你的破事烦我。”", type: "D" }
                ] },
                { text: "如果“拒绝别人”会让你产生100分的内疚感，而“委屈自己答应”只会产生50分的憋屈感，你通常会选择：", options: [
                    { t: "永远选择委屈自己，我的心理账户里早就装满了憋屈，再多一点也无所谓。", type: "A" },
                    { t: "每次都想选拒绝，但在最后关头总是向内疚感妥协，事后又后悔不已。", type: "B" },
                    { t: "理性评估这件事的底线，如果是原则问题，我宁愿承受100分的内疚也会拒绝。", type: "C" },
                    { t: "我拒绝别人不仅不会内疚，还会产生100分的快感。", type: "D" }
                ] },
                { text: "你和同事一起点外卖，大家都想吃辣的，但你最近胃溃疡绝对不能吃辣。当大家询问你的意见时，你会：", options: [
                    { t: "说“我也超爱吃辣”，然后强忍着胃痛吃下去，半夜偷偷去医院挂急诊。", type: "A" },
                    { t: "犹豫半天说“我都行，听你们的”，然后在饭桌上只吃白米饭，心里暗自委屈。", type: "B" },
                    { t: "坦陈自己的身体状况：“我胃溃疡不能吃辣，要不我们点两家不同的，或者换一家清淡的？”", type: "C" },
                    { t: "强硬地说：“我胃不好，今天所有人必须陪我吃白粥，谁不乐意谁自己出去吃。”", type: "D" }
                ] },
                { text: "在人际交往的隐形账本上，你最害怕看到哪种记录？", options: [
                    { t: "“我今天好像麻烦了别人”（这会让你焦虑不安，想立刻用十倍去补偿）。", type: "A" },
                    { t: "“我付出了真心，但对方似乎并不在乎”（这会让你陷入长期的内耗）。", type: "B" },
                    { t: "“这是一段长期处于消耗和失衡状态的关系”（这会让你理性地考虑退出）。", type: "C" },
                    { t: "“那个人居然敢占我的便宜”（这会让你立刻开启战斗模式）。", type: "D" }
                ] },
                { part: "第六篇章：存在主义心理学（本真性与自我异化）", text: "存在主义认为人必须为自己的选择承担责任。当你面临“留在大城市内卷”还是“回老家过安稳日子”的选择时，你的决策依据主要是：", options: [
                    { t: "父母的面子、亲戚的看法、朋友的期待——什么能让他们满意，我就选什么。", type: "A" },
                    { t: "在世俗标准和内心渴望之间极度撕裂，最后往往半推半就地选了大多数人选的那条路。", type: "B" },
                    { t: "倾听自己内心真实的声音，权衡利弊后做出选择，并愿意为这个选择带来的苦与乐买单。", type: "C" },
                    { t: "闭着眼睛瞎选，认为人生本来就是毫无意义的荒诞剧，选什么都一样烂。", type: "D" }
                ] },
                { text: "你在职场上扮演了一个多年的“老好人”角色。随着时间的推移，你发现：", options: [
                    { t: "我已经忘记了生气的滋味，即使被严重侵犯权益，我也只会机械地赔笑脸。", type: "A" },
                    { t: "我每天都在“不想干了”和“不敢辞职”的抑郁中挣扎，感觉真实的自己正在死去。", type: "B" },
                    { t: "我开始有意识地撕下这个标签，学会在需要的时候展示锋芒，哪怕这会引起短暂的阵痛。", type: "C" },
                    { t: "我利用这种伪装降低了别人的防备，最终目的是为了把他们都踩在脚下。", type: "D" }
                ] },
                { text: "面对自由带来的巨大焦虑（因为自由意味着你要对自己全权负责），你常常试图通过什么方式逃避？", options: [
                    { t: "把自己变成公司、家庭或伴侣的附庸，让他们来替我做决定，我只负责执行。", type: "A" },
                    { t: "随波逐流，别人结婚我结婚，别人买房我买房，用世俗的枷锁来逃避思考的痛苦。", type: "B" },
                    { t: "直面这种焦虑，勇敢地创造属于自己的人生意义，哪怕这条路充满未知。", type: "C" },
                    { t: "用酒精、游戏或极度的犬儒主义来麻痹自己，拒绝参与任何真实的构建。", type: "D" }
                ] },
                { text: "当你意识到，你所爱的人，爱的其实是你为了迎合他而精心伪装出来的“完美伴侣”时：", options: [
                    { t: "我会更加谨小慎微地维持这个完美的幻影，宁愿一辈子不卸妆，也不愿失去他。", type: "A" },
                    { t: "感到深深的悲哀和孤独，哪怕睡在一张床上，也觉得隔着最远的距离。", type: "B" },
                    { t: "决定慢慢向他展现真实的、不完美的自己，如果他因此离开，那就让他离开。", type: "C" },
                    { t: "觉得他是个只能接受虚假的蠢货，于是我变本加厉地欺骗他，直到榨干他的价值。", type: "D" }
                ] },
                { text: "假设此时此刻就是生命的尽头，如果你发现自己这一生都是在为了满足别人的期待而活，你的感受是：", options: [
                    { t: "觉得这是一种伟大，我用我的一生燃烧了自己，照亮了别人，我没有遗憾。", type: "A" },
                    { t: "充满无尽的悔恨和愤怒，痛哭流涕地质问上天为什么不给我重来一次的机会。", type: "B" },
                    { t: "庆幸自己早已觉醒，虽然也曾妥协，但我终究夺回了人生的方向盘。", type: "C" },
                    { t: "冷笑一声，觉得不管是为谁活，这世界早点毁灭最好。", type: "D" }
                ] },
                { text: "明天早晨，当你再次走进那个充满人际博弈的办公室，或者面对那个总是索取的亲友时，你决定：", options: [
                    { t: "继续扬起卑微的笑脸，把“好的”、“没问题”、“对不起”挂在嘴边。", type: "A" },
                    { t: "在心里默默发誓今天一定要拒绝一次，但当对方一开口，我又一次溃败了。", type: "B" },
                    { t: "深吸一口气，用温和而坚定的声音，说出生命中最重要的那个词：“不”。", type: "C" },
                    { t: "带着满腔怒火去上班，准备把所有惹我的人都痛骂一顿。", type: "D" }
                ] },
                
                // ------ 第七篇章 (维度2：社交耗能指数) ------
                { part: "第七篇章：灵魂的电池<br>能量心理学与高敏感特质", text: "在一场长达三小时的、充满寒暄与社交辞令的行业聚会后，你终于回到了自己安静的房间。关上门的那一刻，你的感受是：", options: [
                    { t: "灵魂仿佛被抽干，感觉自己像一个漏水的破罐子，需要三天完全不说话才能恢复出厂设置。", type: "A" },
                    { t: "长舒一口气，感觉“电量”只剩10%，连洗漱的力气都没有，只想立刻瘫倒在床上。", type: "B" },
                    { t: "有些疲惫，但洗个热水澡、听几首轻音乐后，感觉自己又能恢复平静。", type: "C" },
                    { t: "意犹未尽，甚至还想打电话给朋友继续讨论刚才聚会上的趣事。", type: "D" }
                ] },
                { text: "工作中，你需要长时间维持一个“专业、友善、情绪稳定”的完美职场人设。对你来说，这种“情绪劳动”就像：", options: [
                    { t: "在深海里憋气潜水。每一秒都在消耗生命值，如果不赶紧浮出水面（独处），就会窒息而亡。", type: "A" },
                    { t: "穿着一件极其沉重且不透气的华丽铠甲。虽然能保护自己，但勒得浑身酸痛。", type: "B" },
                    { t: "穿上一套合身的职业装。虽然不如睡衣舒服，但下班脱掉就好了。", type: "C" },
                    { t: "穿上了拥有魔法的披风。这种扮演让我感到如鱼得水，甚至能激发我的潜能。", type: "D" }
                ] },
                { text: "你的手机突然在一个小时内弹出了50条充满热闹闲聊的群消息，或者几个朋友同时找你吐槽。你的第一反应是：", options: [
                    { t: "强烈的生理性恐慌和烦躁。立刻开启免打扰，甚至想把手机直接扔出窗外。", type: "A" },
                    { t: "感到一阵沉重的压迫感。叹着气一条条看，为了显得合群，勉强挤出几个表情包回复。", type: "B" },
                    { t: "随缘点开。有精力就参与几句，没精力就放着不看，不觉得有什么心理负担。", type: "C" },
